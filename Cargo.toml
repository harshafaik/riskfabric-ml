[package]
name = "riskfabric"
version = "0.1.0"
edition = "2024"

[dependencies]
rayon = '1.11.0'
chrono = "0.4.42"
polars = { version = "0.51.0", features = [
  "lazy",
  "parquet",
  "dtype-struct",
  "dtype-datetime",
  "serde",
  "temporal",
  "strings",
  "is_in",
  "cum_agg",
  "ipc",
] }
clap = { version = "4.5.60", features = ["derive"] }
